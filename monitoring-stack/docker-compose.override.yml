---
services:
  metrics-service:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./metrics-service:/app   # bind mount for live reload
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "app"]  # matches /metrics-service/app.py entry
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring-net
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-enterprise:11.6
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ./grafana:/var/lib/grafana
    networks:
      - monitoring-net
    ports:
      - "3000:3000"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - monitoring-net
    ports:
      - "9093:9093"
