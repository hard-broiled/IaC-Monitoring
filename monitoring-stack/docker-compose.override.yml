---
services:
  metrics-service:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./metrics-service:/app   # bind mount for live reload
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "app"]  # matches /metrics-service/app.py entry
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.5.0  # prom/prometheus:v2.49.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ./prometheus/test-rules.yml:/etc/prometheus/test-rules.yml:ro
    networks:
      - monitoring-net
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana-enterprise:11.6  # grafana/grafana:10.2.2
    container_name: grafana
    restart: unless-stopped
    depends_on: 
      - prometheus
    volumes:
      - ./grafana:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring-net
    ports:
      - "3000:3000"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    networks:
      - monitoring-net
    ports:
      - "9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
