---
# alertmanager.yml
global:
  resolve_timeout: 5m
  ## Email/SMS/Slack config placeholders
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alertmanager@example.com'
  # smtp_auth_username: 'user'
  # smtp_auth_password: 'password'
  # slack_api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ' # Replace with real webhook

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'console'

receivers:
  - name: 'console'  # placeholder for slack/email receivers
  # Alt dummy receiver option
    webhook_configs:
        - url: "http:host.docker.internal:5002/"
          send_resolved: true
    # For real Slack/email integration, uncomment and configure:
    # email_configs:
    #   - to: 'team@example.com'
    # slack_configs:
    #   - channel: '#alerts'

inhibit_rules:
  # Example: suppress notifications if a "down" alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']
